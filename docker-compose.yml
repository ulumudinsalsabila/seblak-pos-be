services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seblak_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - seblak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seblak_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  seblak_postgres_data:
